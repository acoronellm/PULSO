model_type: xgboost

scoring: roc_auc
cv: 5

param_grid:
  model__n_estimators:
    - 200
    - 300
    - 400

  model__max_depth:
    - 3
    - 4
    - 5

  model__learning_rate:
    - 0.03
    - 0.05
    - 0.1

  model__subsample:
    - 0.8
    - 1.0

  model__colsample_bytree:
    - 0.8
    - 1.0

  model__min_child_weight:
    - 1
    - 3
    - 5

  model__reg_lambda:
    - 1
    - 5