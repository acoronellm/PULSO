model_type: gradient_boosting

scoring: roc_auc
cv: 5

param_grid:
  model__n_estimators:
    - 200
    - 300
    - 400

  model__learning_rate:
    - 0.03
    - 0.05
    - 0.1

  model__max_depth:
    - 2
    - 3
    - 4
    - 5

  model__subsample:
    - 0.8
    - 1.0

  model__min_samples_split:
    - 2
    - 5
    - 10

  model__min_samples_leaf:
    - 1
    - 2
    - 5
    - 10
