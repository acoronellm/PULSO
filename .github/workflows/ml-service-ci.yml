name: ML Service checks

on:
  pull_request:
    paths:
      - "ml_service/**"
      - ".github/workflows/ml-service-ci.yml"

  push:
    branches:
      - main
    paths:
      - "ml_service/**"
      - ".github/workflows/ml-service-ci.yml"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install ML Service dependencies
        run: |
          python -m pip install -r ml_service/requirements.txt

      - name: Run ML Service tests
        run: |
          python -m pytest -q ml_service/tests