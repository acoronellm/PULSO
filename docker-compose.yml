services:

  postgres:
    image: postgres:16-alpine
    container_name: pulso-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulso}
      POSTGRES_USER: ${POSTGRES_USER:-pulso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulso_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pulso-postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile

    container_name: pulso-ml-service

    volumes:
      - ./artifacts:/app/artifacts:ro

    ports:
      - "127.0.0.1:8001:8001"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: pulso-backend

    environment:
      ML_SERVICE_URL: http://ml-service:8001
      ML_TIMEOUT_SECONDS: 30

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulso}:${POSTGRES_PASSWORD:-pulso_dev_password}@postgres:5432/${POSTGRES_DB:-pulso}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-}
      RAG_TIMEOUT_SECONDS: 30
      ANALYSIS_CACHE_TTL_SECONDS: 900
      ANALYSIS_CACHE_MAX_ENTRIES: 100

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      ml-service:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: pulso-frontend

    expose:
      - "80"

    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine

    container_name: pulso-nginx

    ports:
      - "80:80"

    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend

    restart: unless-stopped

volumes:
  pulso-postgres-data: